<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ambiance Van der Wal · Potentie Baarn en Austerlitz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

:root{--bg:#12141d;--bg2:#1a1d2a;--bg3:#232736;--text:#eef0f5;--sub:#9296ad;--sub2:#62667f;--acc:#f08822;--acc2:#ffb357;--baarn:#4a9fd4;--aust:#f08822;--old:#dfe2ea;--grey:#6d7189;--up:#4caf7d;--down:#e0637a;--border:#2b2f41;--r:18px;}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
.topbar{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;background:rgba(18,20,29,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;white-space:nowrap}
.logo-sm{width:26px;height:26px;border-radius:50%}
.dots{display:flex;gap:7px;flex-wrap:wrap}
.dots button{width:8px;height:8px;border-radius:50%;border:none;background:var(--border);cursor:pointer;padding:0;transition:all .25s}
.dots button.active{background:var(--acc);width:22px;border-radius:4px}
.pg{color:var(--sub2);font-size:12px;min-width:50px;text-align:right}
.deck{position:relative;width:100vw;height:100vh}
.slide{position:absolute;inset:0;padding:88px 76px 56px;opacity:0;pointer-events:none;transform:translateX(24px);transition:opacity .45s,transform .45s;display:flex;flex-direction:column;overflow-y:auto}
.slide.active{opacity:1;pointer-events:auto;transform:none}
.slide>*{flex-shrink:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
h1.t{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.15;max-width:1100px}
h1.t em{font-style:normal;color:var(--acc2)}
.sub{color:var(--sub);font-size:15px;margin-top:8px;max-width:900px;line-height:1.55}
.head{margin-bottom:26px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--sub)}
.big{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.mid{font-size:26px;font-weight:800;margin-top:6px}
.foot{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.5}
.note{font-size:11.5px;color:var(--sub2);margin-top:16px;line-height:1.6;max-width:1150px}
.navarrow{position:fixed;top:50%;transform:translateY(-50%);z-index:100;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--sub);cursor:pointer;font-size:20px}
.navarrow:hover{background:var(--acc);color:#1a1305;border-color:var(--acc)}
#navPrev{left:14px}#navNext{right:14px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--bg3);border:1px solid var(--border)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.grow{transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
/* intro */
.intro{justify-content:center;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.09;pointer-events:none}
.it{font-size:60px;font-weight:900;letter-spacing:-.03em;line-height:1.02;max-width:1000px;margin-top:22px}
.it span{color:var(--baarn)}.it b{color:var(--aust)}
.isub{color:var(--sub);font-size:18px;margin-top:16px;max-width:780px;line-height:1.55}
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:36px;max-width:1150px}
.qs .card{padding:18px 20px}.qs .n{font-size:28px;font-weight:900;color:var(--acc)}.qs p{font-size:14px;color:#cfd2de;line-height:1.5;margin-top:4px}
/* hero loc cards */
.loc{position:relative;overflow:hidden}
.loc .tag{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.loc .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.loc .row .v{font-size:22px;font-weight:800;margin-top:4px}
.stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
/* funnel */
.fun{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fr{display:grid;grid-template-columns:230px 1fr 130px;gap:14px;align-items:center;font-size:13.5px}
.fr .tr{height:34px;background:var(--bg3);border-radius:8px;overflow:hidden;position:relative}
.fr .tr i{display:block;height:100%;width:0;border-radius:8px}
.fr .val{text-align:right;font-weight:800}
.fr .d{color:var(--sub);font-size:12px}
.minus{color:var(--down);font-weight:800}
/* bars */
.hb{display:grid;grid-template-columns:190px 1fr 92px 86px;gap:12px;align-items:center;font-size:13px;padding:5px 0}
.hb .tr{height:18px;background:var(--bg3);border-radius:5px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px}
.hb .tr u{position:absolute;left:0;top:5px;bottom:5px;width:0;border-radius:3px;background:#fff;text-decoration:none}
.hb .nm b{font-weight:700}.hb .nm span{color:var(--sub2);font-size:11.5px;margin-left:6px}
.hb .r{text-align:right;font-variant-numeric:tabular-nums}
.hbh{font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:4px}
.zero{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(76,175,125,.16);color:var(--up);margin-left:6px}
/* stack */
.stk{display:flex;height:40px;border-radius:10px;overflow:hidden;background:var(--bg3);margin-top:12px}
.stk i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12.5px;font-weight:800;color:#12141c;width:0;white-space:nowrap;overflow:hidden}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:10px}
.leg span{display:inline-flex;align-items:center;gap:7px}.leg i{width:11px;height:11px;border-radius:3px;display:inline-block}.leg b{color:var(--text)}
/* scale */
.scale{position:relative;height:84px;margin:24px 10px 6px}
.scale .ax{position:absolute;left:0;right:0;top:40px;height:10px;border-radius:5px;background:linear-gradient(90deg,#2b2f41,#3a3f55)}
.scale .band{position:absolute;top:36px;height:18px;border-radius:9px;opacity:.35}
.mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11.5px;white-space:nowrap}
.mk .dot{width:18px;height:18px;border-radius:50%;margin:26px auto 0;border:3px solid var(--bg2)}
.mk .t{position:absolute;left:50%;transform:translateX(-50%);font-weight:700}
.mk.up .t{top:0}.mk.dn .t{top:62px}
.ticks{position:relative;height:16px;margin:0 10px;font-size:10.5px;color:var(--sub2)}
.ticks span{position:absolute;transform:translateX(-50%)}
/* rr */
.rr{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr);gap:0;align-items:stretch}
.rr .card.pos{border-top:4px solid var(--up)}.rr .card.neg{border-top:4px solid var(--down)}
.vs{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--sub2)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.kv:last-child{border-bottom:none}.kv b{font-size:19px;font-weight:800;white-space:nowrap}
.kv span{color:#cfd2de;line-height:1.45}
/* summary table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;padding:0 12px 10px;border-bottom:1px solid var(--border)}
td{padding:13px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:none}
td.k{color:var(--sub);font-weight:600;width:230px}
.defbox{background:rgba(240,136,34,.08);border:1px solid rgba(240,136,34,.35);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.55;color:#d6d8e2;max-width:1150px}
.defbox b{color:var(--acc2)}
/* gate */
.gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center}
.gate-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:40px 36px;width:340px;max-width:92vw;text-align:center}
.gate-card img{width:72px;height:72px;border-radius:50%}
.gate-title{font-size:18px;font-weight:800;margin:18px 0 6px}.gate-sub{color:var(--sub);font-size:13px;margin-bottom:22px}
.gate input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;text-align:center;outline:none}
.gate input:focus{border-color:var(--acc)}.gate input.err{border-color:var(--down);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gate button{width:100%;margin-top:14px;background:var(--acc);color:#1a1305;border:none;border-radius:10px;padding:12px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.gate-err{color:var(--down);font-size:12.5px;margin-top:10px;min-height:16px}
svg text{font-family:Inter,system-ui,sans-serif}
@media (max-width:900px){.slide{padding:84px 18px 60px}.g2,.g3,.g4,.qs,.rr{grid-template-columns:1fr}.vs{padding:8px}.it{font-size:36px}h1.t{font-size:24px}.big{font-size:34px}.hb{grid-template-columns:120px 1fr 70px}.hb .r2{display:none}.fr{grid-template-columns:1fr;gap:4px}.navarrow{display:none}.dots{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.stackcard+.stackcard{margin-top:14px}.bigq{font-size:15px;font-weight:800;margin-bottom:4px}

.toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;visibility:hidden;opacity:0;transition:opacity .2s}
.toggle.visible{visibility:visible;opacity:1}
.toggle button{border:none;background:transparent;color:var(--sub);font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer}
.toggle button.active{background:var(--aust);color:#1a1305}.toggle button[data-loc="Baarn"].active{background:var(--baarn);color:#06131d}
.right{display:flex;align-items:center;gap:14px}
.sec{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub2);margin-left:10px}
.pill{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.p-feit{background:rgba(74,159,212,.16);color:#86c4ec}.p-int{background:rgba(185,166,232,.16);color:#cbbcf2}.p-vraag{background:rgba(240,136,34,.16);color:var(--acc2)}
.p-nieuw{background:rgba(76,175,125,.16);color:var(--up)}.p-best{background:rgba(223,226,234,.12);color:#dfe2ea}.p-gelijk{background:rgba(109,113,137,.25);color:#b8bbcc}.p-onz{background:rgba(224,99,122,.14);color:var(--down)}
.question{margin-top:18px;border-left:4px solid var(--acc);background:rgba(240,136,34,.07);border-radius:0 12px 12px 0;padding:14px 18px;font-size:16px;font-weight:700;line-height:1.45;max-width:1150px}
.list{list-style:none;display:flex;flex-direction:column;gap:9px;margin-top:10px}
.list li{font-size:13.5px;line-height:1.5;color:#d6d8e2;display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.pair{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.pair:last-child{border-bottom:none}
.pair .m{font-size:13px;color:var(--sub);font-weight:600}
.pb{display:flex;align-items:center;gap:10px}.pb .tr{flex:1;height:22px;background:var(--bg3);border-radius:6px;overflow:hidden}.pb .tr i{display:block;height:100%;width:0;border-radius:6px}
.pb b{min-width:92px;text-align:right;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.tbl{font-size:13px}.tbl td{padding:9px 10px}.tbl th{padding:0 10px 9px}.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:800;border-top:1px solid var(--sub2)}
.scroll{overflow-x:auto}
.cat{border-radius:var(--r);padding:18px 20px;background:var(--bg2);border:1px solid var(--border);position:relative}
.cat .letter{position:absolute;top:14px;right:18px;font-size:34px;font-weight:900;opacity:.18}
.hbar2{display:grid;grid-template-columns:120px 1fr 96px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.hbar2 .tr{height:16px;background:var(--bg3);border-radius:5px;overflow:hidden}.hbar2 .tr i{display:block;height:100%;width:0;border-radius:5px}
.hbar2 b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:900px){.pair{grid-template-columns:1fr}.list li{grid-template-columns:1fr}.hbar2{grid-template-columns:90px 1fr 80px}.right .pg{display:none}}

/* Consistente indeling: per postcode de klasse uit de potentie-analyse (t.o.v. Hilversum, Bussum én De Bilt) gekoppeld aan de omzet per vestiging */
function cats(n){const pc={};P[n].postcodes.forEach(r=>pc[r.pc4]=r);const out={};
['nieuw','gelijk','bestaand','onzeker'].forEach(c=>{const rs=D[n].postcodes.filter(r=>pc[r.pc4].klasse===c);
out[c]={pc4:rs.length,omzet:sum(rs,r=>r.omzet),orders:sum(rs,r=>r.orders),via:Object.fromEntries(VEST.map(v=>[v,sum(rs,r=>r.via[v])])),best:(c==='nieuw'?P[n].kern:P[n][c]).best};});return out;}

function stk(parts,fmt=k){const t=sum(parts,p=>p[1]);return `<div class="stk">${parts.filter(p=>p[1]>0).map(p=>`<i class="grow" style="background:${p[2]}" data-w="${W(p[1],t)}">${p[1]/t>.09?dec(p[1]/t*100,0)+'%':''}</i>`).join('')}</div><div class="leg">${parts.map(p=>`<span><i style="background:${p[2]}"></i>${p[0]} <b>${fmt(p[1])}</b></span>`).join('')}</div>`;}

function rIntro(){return `<div class="intro" style="min-height:100%;display:flex;flex-direction:column;justify-content:center">
<div class="blob" style="width:700px;height:700px;background:var(--baarn);top:-260px;right:-120px"></div><div class="blob" style="width:520px;height:520px;background:var(--aust);bottom:-240px;right:260px"></div>
<div style="position:relative"><img src="${LOGO}" style="width:80px;height:80px;border-radius:50%" alt="">
<div class="it">Marktpotentieel <span>Baarn</span> en <b>Austerlitz</b></div>
<div class="isub">Van der Wal overweegt twee eigen winkels onder Ambiance te brengen. Deze analyse geeft een referentiekader voor die keuze, geen omzetverwachting.</div>
<div class="qs">
<div class="card"><div class="lbl" style="color:var(--baarn)">Baarn · Nijhof · 3741 GR</div><p>Ambiance-logo op de bestaande Nijhof-winkel, mogelijk per 1 december of 1 januari. Vraag: nieuwe klanten, of verschuiving van Hilversum?</p></div>
<div class="card"><div class="lbl" style="color:var(--aust)">Austerlitz · Verandi · 3711 AA</div><p>Mogelijke ombouw van de Verandi-winkel tot Ambiance-vestiging. Vraag: welke markt ligt rond deze winkel zelf?</p></div>
<div class="card"><div class="lbl">Onderzoeksvraag</div><p>Hoe groot is het marktpotentieel binnen 15 minuten, na aftrek van wat dichter bij Hilversum, Bussum of De Bilt ligt, en hoe verhoudt zich dat tot wat die vestigingen nu halen?</p></div></div></div></div>`;}

/* 2 MANAGEMENT */
function rMgmt(){const b=P.Baarn.kern,a=P.Austerlitz.kern,cb=CAT.Baarn.nieuw;
const kpi=(n,x)=>`<div class="card loc"><div class="stripe" style="background:${C[n]}"></div><div class="tag" style="color:${C[n]}">${n}</div>
<div class="lbl" style="margin-top:12px">Marktpotentieel eigen gebied</div><div class="big" style="color:${C[n]}">${mln(x.best)}</div><div class="foot">per jaar, incl. btw</div>
<div class="row"><div><div class="lbl">Huishoudens</div><div class="v">${num(x.hh)}</div></div><div><div class="lbl">Inkomensindex</div><div class="v">${dec(x.inkidx,1)}</div></div><div><div class="lbl">Marktaandeel nu</div><div class="v">${dec(x.ma,2)}%</div></div></div></div>`;
return head('Managementoverzicht','De belangrijkste uitkomsten','')+`<div class="g2">${kpi('Baarn',b)}${kpi('Austerlitz',a)}</div>
<div class="card" style="margin-top:18px"><ul class="list">
<li>${tag.feit}<span>Baarn heeft ${dec(b.best/a.best,1)}× zoveel marktpotentieel als Austerlitz; Austerlitz heeft de hogere inkomensindex (${dec(a.inkidx,1)} tegen ${dec(b.inkidx,1)}).</span></li>
<li>${tag.feit}<span>Hilversum haalt ${dec(R.Hilversum.ma,2)}% marktaandeel in het eigen 15-minutengebied, De Bilt ${dec(R['De Bilt'].ma,2)}% en Bussum ${dec(R.Bussum.ma,2)}%. De inkomensindex verschilt veel minder.</span></li>
<li>${tag.feit}<span>Van der Wal verkocht in 2025 ${eur(cb.omzet)} in het eigen gebied van Baarn, waarvan ${eur(cb.via.Hilversum)} via Hilversum. Dat deel kan intern verschuiven; het is geen extra omzet.</span></li>
<li>${tag.int}<span>In beide gebieden is het huidige marktaandeel laag vergeleken met de bestaande vestigingen. Of een nieuwe winkel daar iets aan verandert, is met deze gegevens niet te zeggen.</span></li></ul></div>`;}

/* 3 POTENTIE NAAST ELKAAR */
function rPotentie(){const b=P.Baarn.kern,a=P.Austerlitz.kern;
const pr=(m,f,vb,va,max,foot)=>`<div class="pair"><div class="m">${m}${foot?`<div style="font-size:11px;color:var(--sub2);font-weight:500;margin-top:2px">${foot}</div>`:''}</div>
<div class="pb"><div class="tr"><i class="grow" style="background:${C.Baarn}" data-w="${W(vb,max)}"></i></div><b>${f(vb)}</b></div><div class="pb"><div class="tr"><i class="grow" style="background:${C.Austerlitz}" data-w="${W(va,max)}"></i></div><b>${f(va)}</b></div></div>`;
return head('Marktpotentieel','Baarn heeft de <em>grootste</em> markt, Austerlitz de <em>rijkste</em>','Eigen verzorgingsgebied: alle postcodes binnen 15 minuten, zonder de postcodes die even ver of dichter bij Hilversum, Bussum of De Bilt liggen.')+
`<div class="card"><div class="pair" style="padding-top:0"><div></div><div class="lbl" style="color:${C.Baarn}">Baarn · ${b.pc4} postcodes</div><div class="lbl" style="color:${C.Austerlitz}">Austerlitz · ${a.pc4} postcodes</div></div>
${pr('Marktpotentieel',mln,b.best,a.best,b.best,'per jaar, incl. btw')}
${pr('Huishoudens',num,b.hh,a.hh,b.hh)}
${pr('Inkomensindex',x=>dec(x,1),b.inkidx,a.inkidx,130,'gewogen naar inwoners, 100 = NL')}
${pr('Marktaandeel Van der Wal nu',x=>dec(x,2)+'%',b.ma,a.ma,3,'omzet 2025 / marktpotentieel')}</div>
<div class="g2" style="margin-top:16px"><div class="card"><div class="lbl">Twee verschillende kenmerken</div><div class="foot" style="font-size:14px;color:#d6d8e2">Het <b>marktpotentieel</b> zegt hoeveel er in totaal wordt uitgegeven; dat hangt vooral af van het aantal huishoudens. De <b>inkomensindex</b> zegt hoe koopkrachtig die huishoudens gemiddeld zijn.</div></div>
<div class="card"><div class="lbl">Wat het niet zegt</div><div class="foot" style="font-size:14px;color:#d6d8e2">Een hogere inkomensindex betekent niet automatisch meer totaal marktpotentieel of een hoger toekomstig marktaandeel. Austerlitz is rijker, Baarn is groter.</div></div></div>`;}

/* 4 FUNNEL */
function funnel(n){const p=P[n],t=p.totaal15.best,col=C[n];
const rows=[['Alles binnen 15 min van '+n,t,col,p.totaal15.pc4+' postcodes',''],
['Dichter bij Hilversum, Bussum of De Bilt',p.bestaand.best,'#dfe2ea',p.bestaand.pc4+' postcodes','–'],
['Gelijke reistijd',p.gelijk.best,C.grey,p.gelijk.pc4+' postcodes','–'],
['Reistijd naar Bussum onbekend',p.onzeker.best,C.grey,p.onzeker.pc4+' postcode','–'],
['Eigen verzorgingsgebied '+n,p.kern.best,col,p.kern.pc4+' postcodes · index '+dec(p.kern.inkidx,1),'=']].filter(r=>r[4]!=='–'||r[1]>0);
return `<div class="card"><div class="lbl" style="color:${col}">${n}</div><div class="fun">${rows.map(r=>`<div class="fr"><div>${r[4]?`<span class="${r[4]==='–'?'minus':''}" style="margin-right:6px">${r[4]}</span>`:''}<b>${r[0]}</b><div class="d">${r[3]}</div></div><div class="tr"><i class="grow" style="background:${r[2]};${r[4]==='–'?'opacity:.55':''}" data-w="${W(r[1],t)}"></i></div><div class="val">${mln(r[1])}</div></div>`).join('')}</div></div>`;}
function rFunnel(){return head('Marktpotentieel','Van 15-minutengebied naar eigen verzorgingsgebied','Stap 1: alle postcodes binnen 15 minuten. Stap 2: postcodes eruit die dichter bij of even ver van een bestaande vestiging liggen. Stap 3: marktpotentieel van de rest optellen. Bedragen per jaar, incl. btw.')+
`<div style="display:flex;flex-direction:column;gap:16px">${funnel('Baarn')}${funnel('Austerlitz')}</div>
<div class="note">Bij Baarn is getoetst tegen alle drie de bestaande vestigingen; Bussum is hier van belang (Laren, Erica, Sportpark-Zuid). Postcode 1252 (Plan Postiljon) telt niet mee: de reistijd naar Bussum ligt binnen 15 minuten maar is niet exact bekend.</div>`;}

/* 5 REFERENTIE */
function rReferentie(){const mx=11,bars=VEST.map(v=>`<div class="fr" style="grid-template-columns:110px 1fr 90px"><b>${v}</b><div class="tr"><i class="grow" style="background:${C[v]}" data-w="${W(R[v].ma,mx)}"></i></div><div class="val" style="font-size:18px">${dec(R[v].ma,2)}%</div></div>`).join('');
return head('Historisch referentiekader','Hilversum haalt <em>bijna drie keer</em> het marktaandeel van De Bilt','Marktaandeel = eigen particuliere omzet 2025 van de vestiging uit postcodes binnen 15 minuten, gedeeld door het marktpotentieel van die postcodes.')+
`<div class="g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start"><div class="card"><div class="lbl">Marktaandeel binnen 15 minuten, 2025</div><div class="fun" style="margin-top:18px">${bars}</div>
<div class="lbl" style="margin-top:26px">Inkomensindex</div><div class="fun" style="margin-top:12px">${VEST.map(v=>`<div class="fr" style="grid-template-columns:110px 1fr 90px"><b>${v}</b><div class="tr"><i class="grow" style="background:${C[v]};opacity:.5" data-w="${W(R[v].inkidx,130)}"></i></div><div class="val">${dec(R[v].inkidx,1)}</div></div>`).join('')}</div></div>
<div><div class="card scroll"><table class="tbl"><thead><tr><th></th><th class="num">Marktpotentieel</th><th class="num">Index</th><th class="num">Omzet 2025</th><th class="num">Marktaandeel</th></tr></thead><tbody>
${VEST.map(v=>`<tr><td><b style="color:${C[v]}">${v}</b><div style="font-size:11px;color:var(--sub2)">${R[v].pc4} postcodes</div></td><td class="num">${eur(R[v].best)}</td><td class="num">${dec(R[v].inkidx,1)}</td><td class="num">${eur(R[v].omzet)}</td><td class="num"><b>${dec(R[v].ma,2)}%</b></td></tr>`).join('')}</tbody></table><div class="note" style="margin-top:8px">Bedragen incl. btw. Omzet = particulier, alleen de eigen vestiging.</div></div>
<div class="card" style="margin-top:14px"><ul class="list">
<li>${tag.feit}<span>Het verschil in marktaandeel tussen Hilversum en De Bilt (${dec(R.Hilversum.ma/R['De Bilt'].ma,1)}×) is veel groter dan het verschil in inkomensindex (${dec(R.Hilversum.inkidx,1)} tegen ${dec(R['De Bilt'].inkidx,1)}). Bussum heeft de hoogste index en het laagste marktaandeel.</span></li>
<li>${tag.int}<span>Inkomen alleen verklaart de verschillen dus niet. Mogelijke factoren, niet onderzocht en niet bewezen: winkelgrootte, naamsbekendheid, concurrentie, bestaande klantrelaties en de aantrekkingskracht van de showroom.</span></li></ul></div></div></div>
<div class="note"><b>Beperkingen.</b> 1. Hilversum is begin 2026 verhuisd: de omzet 2025 hoort bij de vorige locatie, het 15-minutengebied is berekend vanaf het huidige adres. 2. De gebieden van Hilversum en Bussum overlappen; per vestiging telt alleen de eigen omzet, waardoor Bussum lager uitkomt waar Hilversum dezelfde wijken bedient.</div>`;}

/* 6 KADER */
function rKader(){const pts=[
{n:'Hilversum',x:R.Hilversum.inkidx,y:R.Hilversum.ma,b:R.Hilversum.best,c:C.Hilversum},{n:'Bussum',x:R.Bussum.inkidx,y:R.Bussum.ma,b:R.Bussum.best,c:C.Bussum},{n:'De Bilt',x:R['De Bilt'].inkidx,y:R['De Bilt'].ma,b:R['De Bilt'].best,c:C['De Bilt']},
{n:'Baarn, nu',x:P.Baarn.kern.inkidx,y:P.Baarn.kern.ma,b:P.Baarn.kern.best,c:C.Baarn,nw:1,left:1},{n:'Austerlitz, nu',x:P.Austerlitz.kern.inkidx,y:P.Austerlitz.kern.ma,b:P.Austerlitz.kern.best,c:C.Austerlitz,nw:1,left:1}];
const w=760,h=410,m={l:56,r:24,t:18,b:48},x0=104,x1=132,y1=12,X=v=>m.l+(v-x0)/(x1-x0)*(w-m.l-m.r),Y=v=>h-m.b-v/y1*(h-m.t-m.b),rad=b=>8+Math.sqrt(b/1e6)*5.5;
let g='';for(let y=0;y<=12;y+=2)g+=`<line x1="${m.l}" x2="${w-m.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="#2b2f41"/><text x="${m.l-10}" y="${Y(y)+4}" text-anchor="end" font-size="11" fill="#62667f">${y}%</text>`;
for(let x=104;x<=132;x+=4)g+=`<text x="${X(x)}" y="${h-m.b+20}" text-anchor="middle" font-size="11" fill="#62667f">${x}</text>`;
g+=`<text x="${(w+m.l)/2}" y="${h-6}" text-anchor="middle" font-size="12" fill="#9296ad">Inkomensindex (gewogen, 100 = NL)</text><text transform="translate(14 ${h/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#9296ad">Marktaandeel</text>`;
pts.forEach(p=>{const cx=X(p.x),cy=Y(p.y),r=rad(p.b),tx=p.left?cx-r-8:cx+r+8,an=p.left?'end':'start',ty=p.left?cy+10:cy;g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${p.c}" fill-opacity="${p.nw?.22:.85}" stroke="${p.c}" stroke-width="2" ${p.nw?'stroke-dasharray="4 3"':''}/><text x="${tx}" y="${ty-2}" text-anchor="${an}" font-size="13" font-weight="800" fill="#eef0f5">${p.n}</text><text x="${tx}" y="${ty+14}" text-anchor="${an}" font-size="11.5" fill="#9296ad">${dec(p.y,2)}% · index ${dec(p.x,1)}</text>`;});
return head('Referentiekader','Baarn en Austerlitz naast de bestaande vestigingen','Inkomensindex en huidig marktaandeel van de twee eigen verzorgingsgebieden, naast de referentiecijfers. Grootte van de bol = marktpotentieel.')+
`<div class="g2" style="grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start"><div class="card"><svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Marktaandeel tegen inkomensindex">${g}</svg>
<div class="leg"><span><i style="background:#dfe2ea"></i>Bestaande vestiging, eigen omzet</span><span><i style="border:2px dashed #4a9fd4;background:transparent"></i>Nieuw gebied, omzet van alle VdW-vestigingen samen</span></div></div>
<div style="display:flex;flex-direction:column;gap:14px">
<div class="card"><div class="lbl">Hoe te lezen</div><div class="foot" style="font-size:13.5px;color:#d6d8e2">Het kader laat zien tussen welke waarden de bestaande vestigingen zich bewegen (${dec(R.Bussum.ma,2)}% tot ${dec(R.Hilversum.ma,2)}%) en waar de nieuwe gebieden nu staan zonder eigen winkel.</div></div>
<div class="card"><div class="lbl">Wat het niet is</div><div class="foot" style="font-size:13.5px;color:#d6d8e2">Geen berekend of verwacht marktaandeel voor Baarn of Austerlitz. De punten liggen niet op een lijn: inkomen en marktaandeel hangen hier niet aantoonbaar samen.</div></div>
<div class="card"><div class="lbl">Let op definitie</div><div class="foot" style="font-size:13.5px;color:#d6d8e2">Bij de bestaande vestigingen telt alleen de eigen omzet. Bij Baarn en Austerlitz telt de omzet van alle Van der Wal-vestigingen, omdat daar nog geen eigen winkel is.</div></div></div></div>`;}

/* 7 BESTAANDE OMZET (reeds uitgevoerd, toggle) */
function rBestaand(){const x=D[state.loc],n=x.nieuw,o=x.oud,g=x.groepen,t=x.omzet,cn=C[n],c=CAT[n];
const vest=[['Via '+o,x.per_vest[o],'#dfe2ea'],...VEST.filter(v=>v!==o).map(v=>['Via '+v,x.per_vest[v],C[v]])];
return head('Bestaande klanten en omzet',`${n}: ${eur(t)} omzet 2025 binnen 15 minuten`,`Reeds uitgevoerde analyse. Particulier, incl. btw. ${x.n_pc4} postcodes, ${num(x.orders)} orders. ${n} ligt ${x.rt_nieuw_naar_oud} minuten van ${o}.`)+
`<div class="card stackcard"><div class="bigq">1. Via welke vestiging kochten deze klanten?</div>${stk(vest,eur)}</div>
<div class="card stackcard"><div class="bigq">2. Dichter bij ${o} of bij ${n}? <span class="foot">(alleen vergeleken met ${o})</span></div>
${stk([['Dichter bij '+o+' ('+g[o].pc4+' pc)',g[o].omzet,'#dfe2ea'],['Gelijke reistijd ('+g.Gelijk.pc4+' pc)',g.Gelijk.omzet,C.grey],['Dichter bij '+n+' ('+g[n].pc4+' pc)',g[n].omzet,cn]],eur)}</div>
<div class="card stackcard"><div class="bigq">3. In het rayon van ${o}?</div>${stk([['In rayon ('+x.rayon.in.pc4+' pc)',x.rayon.in.omzet,'#dfe2ea'],['Buiten rayon ('+x.rayon.buiten.pc4+' pc)',x.rayon.buiten.omzet,cn]],eur)}</div>
<div class="defbox" style="margin-top:16px">${n==='Baarn'?`<b>Controle.</b> Vraag 2 vergelijkt alleen met Hilversum. Getoetst tegen Hilversum, Bussum én De Bilt (zoals in het marktpotentieel) is de omzet uit postcodes dichter bij Baarn <b>${eur(c.nieuw.omzet)}</b> in plaats van ${eur(g.Baarn.omzet)}. Het verschil zit vooral in Laren-Rijksweg (1251) en Erica (1272), die dichter bij Bussum liggen, en in Sportpark-Zuid en Midden Eng (1402, 1403): gelijk met Hilversum, maar op 3 à 4 minuten van Bussum. De risk/reward-slide gebruikt daarom de getoetste indeling.`:`<b>Controle.</b> Voor Austerlitz geeft toetsen tegen alle drie de vestigingen dezelfde indeling: Hilversum en Bussum liggen buiten bereik. De cijfers hierboven sluiten aan op het marktpotentieel.`}</div>
<div class="note">Zakelijke omzet niet meegeteld (${eur(x.zakelijk.omzet)}, ${num(x.zakelijk.orders)} orders). Eén projectorder in ${D.project.pc4} (${eur(D.project.omzet)}) niet meegeteld.</div>`;}

/* 8 AMERSFOORT */
function rAmf(){const rows=[...AMF].sort((x,y)=>(y.binnen15-x.binnen15)||(y.hh-x.hh));return head('Baarn · Amersfoort','Welk deel van Amersfoort ligt binnen 15 minuten van Baarn?','')+
`<div class="g2" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start"><div><div class="card" style="padding:12px"><img src="${KAART}" alt="Kaart 15 minuten vanaf Baarn" style="width:100%;border-radius:10px;display:block"></div>
<div class="g3" style="margin-top:14px"><div class="card"><div class="lbl">Huishoudens</div><div class="mid">${num(amfHH)}</div><div class="foot">Amersfoort + Hoogland</div></div>
<div class="card"><div class="lbl">Binnen 15 min</div><div class="mid" style="color:${C.Baarn}">${pct(amfHHbin,amfHH)}</div><div class="foot">${num(amfHHbin)} huishoudens</div></div>
<div class="card"><div class="lbl">Omzet 2025</div><div class="mid">${k(amfOm)}</div><div class="foot">${k(amfOmBin)} binnen 15 min, incl. btw</div></div></div></div>
<div class="card scroll"><table class="tbl"><thead><tr><th>Wijk</th><th class="num">Huish.</th><th class="num">Baarn</th><th class="num">Hilversum</th><th class="num">Omzet</th></tr></thead><tbody>
${rows.map(r=>`<tr${r.binnen15?'':' style="opacity:.5"'}><td><b>${r.naam}</b> <span style="color:var(--sub2);font-size:11px">${r.pc4}</span></td><td class="num">${num(r.hh)}</td><td class="num">${r.rt_baarn!=null?r.rt_baarn+' min':'> 15'}</td><td class="num">${r.rt_hilv!=null?r.rt_hilv+' min':'> 30'}</td><td class="num">${r.omzet?eur(r.omzet):'–'}</td></tr>`).join('')}</tbody></table></div></div>
<div class="note">Alleen Amersfoort-Noord (Nieuwland, Vathorst, Kattenbroek, Zielhorst, Valleipoort) en Hoogland vallen binnen 15 minuten, en dan op 11 tot 15 minuten. Centrum, Zuid en West niet. Bron kaart: MCR Retailminds. Projectorder 3816 niet meegeteld.</div>`;}

/* 9 RISK / REWARD */
function rRisk(){const c=CAT.Baarn,A=c.nieuw,B=c.bestaand,O=c.onzeker,bst=P.Baarn.kern.best,mxA=Math.max(A.omzet,1);
const vb=(o,v)=>`<div class="hbar2"><span>${v}</span><div class="tr"><i class="grow" style="background:${C[v]}" data-w="${W(o.via[v],o.omzet)}"></i></div><b>${eur(o.via[v])}</b></div>`;
return head('Baarn · risk / reward','Baarn: nieuwe klanten of omzetverschuiving?','Drie categorieën die niet bij elkaar opgeteld worden. A en B zijn gerealiseerde omzet 2025; C is marktpotentieel. Alle bedragen incl. btw. Getoetst tegen Hilversum, Bussum en De Bilt.')+
`<div class="g3" style="align-items:stretch">
<div class="cat" style="border-top:4px solid var(--down)"><div class="letter">A</div><div class="lbl" style="color:var(--down)">Mogelijke omzetverschuiving</div><div class="big" style="font-size:34px">${eur(A.omzet)}</div><div class="foot">omzet 2025 uit de ${A.pc4} postcodes die dichter bij Baarn liggen, nu bediend door:</div>
${VEST.map(v=>vb(A,v)).join('')}<div class="foot" style="margin-top:10px">Intern: blijft bij Van der Wal. Geen extra omzet.</div></div>
<div class="cat" style="border-top:4px solid #dfe2ea"><div class="letter">B</div><div class="lbl">Blijft geografisch bij huidige vestigingen</div><div class="big" style="font-size:34px">${eur(B.omzet)}</div><div class="foot">omzet 2025 uit ${B.pc4} postcodes dichter bij Hilversum of Bussum, geboekt via:</div>
${VEST.map(v=>vb(B,v)).join('')}<div class="foot" style="margin-top:10px">Gelijke reistijd: ${c.gelijk.pc4} postcodes. Onzeker (1252): ${eur(O.omzet)}.</div></div>
<div class="cat" style="border-top:4px solid var(--up)"><div class="letter">C</div><div class="lbl" style="color:var(--up)">Marktpotentieel eigen gebied</div><div class="big" style="font-size:34px">${mln(bst)}</div><div class="foot">per jaar in de ${A.pc4} postcodes dichter bij Baarn</div>
<div class="stk" style="height:28px"><i class="grow" style="background:${C.Baarn}" data-w="${W(A.omzet,bst)}"></i><i class="grow" style="background:#2e3a4d" data-w="${W(bst-A.omzet,bst)}"></i></div>
<div class="leg"><span><i style="background:${C.Baarn}"></i>VdW nu <b>${pct(A.omzet,bst)}</b></span><span><i style="background:#2e3a4d"></i>Overig <b>${pct(bst-A.omzet,bst)}</b></span></div>
<div class="foot" style="margin-top:10px">Het overige deel is geen gegarandeerde kans: consumenten kopen deels al bij concurrenten.</div></div></div>
<div class="g2" style="margin-top:16px"><div class="card"><div class="lbl">Amersfoort-Noord en Hoogland</div><ul class="list">
<li>${tag.feit}<span>${mln(amfBest)} marktpotentieel, ${num(amfHHbin)} huishoudens, op 11 tot 15 minuten van Baarn en 22 tot 26 minuten van Hilversum. Van der Wal haalde er ${eur(amfOmBin)} (${pct(amfOmBin,amfBest)}).</span></li>
<li>${tag.feit}<span>Hilversum haalt maar ${dec(D.regel80.Hilversum.p15,1)}% van de omzet binnen 15 minuten: de showroom trekt ook klanten van verder weg.</span></li></ul></div>
<div class="card"><div class="lbl">Onzekerheid</div><ul class="list"><li>${tag.int}<span>Reistijd is een geografische indicator, geen gedrag. Wie nu bewust naar de showroom in Hilversum rijdt, stapt niet vanzelf over. Hoeveel klanten werkelijk verschuiven of erbij komen, is met deze gegevens niet vast te stellen.</span></li></ul></div></div>
<div class="question">In hoeverre biedt Baarn toegang tot aanvullende klanten, en welk deel van de bestaande omzet zou mogelijk alleen intern verschuiven?</div>`;}

/* 10 AUSTERLITZ */
function rAust(){const p=P.Austerlitz,c=CAT.Austerlitz,t=p.totaal15.best;
const gel=p.postcodes.filter(r=>r.klasse==='gelijk'),bes=p.postcodes.filter(r=>r.klasse==='bestaand');
return head('Austerlitz','Verzorgingsgebied en overlap met De Bilt',`Austerlitz ligt ${D.Austerlitz.rt_nieuw_naar_oud} minuten van De Bilt. Hilversum en Bussum liggen voor bijna alle postcodes op meer dan 15 minuten; De Bilt is de enige relevante overlap.`)+
`<div class="g2"><div class="card"><div class="bigq">Marktpotentieel 15-minutengebied: ${mln(t)}</div>
${stk([['Eigen gebied ('+p.kern.pc4+' pc)',p.kern.best,C.Austerlitz],['Gelijk met De Bilt ('+p.gelijk.pc4+' pc)',p.gelijk.best,C.grey],['Dichter bij De Bilt ('+p.bestaand.pc4+' pc)',p.bestaand.best,'#dfe2ea']],mln)}
<div class="foot" style="margin-top:12px">Gelijk: ${gel.map(r=>r.naam).join(', ')}. Dichter bij De Bilt: ${bes.map(r=>r.naam).join(', ')}.</div></div>
<div class="card"><div class="bigq">Omzet 2025 in hetzelfde gebied: ${eur(D.Austerlitz.omzet)}</div>
${stk([['Eigen gebied',c.nieuw.omzet,C.Austerlitz],['Gelijk',c.gelijk.omzet,C.grey],['Dichter bij De Bilt',c.bestaand.omzet,'#dfe2ea']],eur)}
<div class="foot" style="margin-top:12px">Van de ${eur(c.nieuw.omzet)} uit het eigen gebied liep ${eur(c.nieuw.via['De Bilt'])} via De Bilt, ${eur(c.nieuw.via.Bussum)} via Bussum en ${eur(c.nieuw.via.Hilversum)} via Hilversum. Incl. btw.</div></div></div>
<div class="g4" style="margin-top:16px">
<div class="card"><div class="lbl">Eigen gebied</div><div class="mid" style="color:${C.Austerlitz}">${mln(p.kern.best)}</div><div class="foot">marktpotentieel/jaar incl. btw</div></div>
<div class="card"><div class="lbl">Inkomensindex</div><div class="mid">${dec(p.kern.inkidx,1)}</div><div class="foot">hoogste van alle gebieden in dit rapport, na Bussum</div></div>
<div class="card"><div class="lbl">Marktaandeel nu</div><div class="mid">${dec(p.kern.ma,2)}%</div><div class="foot">laagste van alle gebieden</div></div>
<div class="card"><div class="lbl">Zonder klant in 2025</div><div class="mid">${p.postcodes.filter(r=>r.klasse==='nieuw'&&r.omzet===0).length} postcodes</div><div class="foot">Woudenberg, Maarn, Blikkenburg</div></div></div>`;}

/* 11/12 BESLIS */
function rBeslis(n){const p=P[n],c=CAT[n],kk=p.kern,col=C[n],isB=n==='Baarn';
const feiten=isB?[
`Marktpotentieel eigen gebied ${mln(kk.best)} per jaar (incl. btw), ${num(kk.hh)} huishoudens, ${kk.pc4} postcodes.`,
`Inkomensindex ${dec(kk.inkidx,1)}: iets onder Hilversum (${dec(R.Hilversum.inkidx,1)}) en Bussum (${dec(R.Bussum.inkidx,1)}).`,
`Marktaandeel Van der Wal nu ${dec(kk.ma,2)}%, tegenover ${dec(R.Bussum.ma,2)}% tot ${dec(R.Hilversum.ma,2)}% bij de bestaande vestigingen.`,
`Amersfoort-Noord en Hoogland: ${mln(amfBest)} marktpotentieel op 11 tot 15 minuten; Van der Wal haalt daar ${pct(amfOmBin,amfBest)}.`,
`Mogelijke verschuiving: ${eur(c.nieuw.omzet)} omzet 2025 uit het eigen gebied, waarvan ${eur(c.nieuw.via.Hilversum)} via Hilversum.`]:[
`Marktpotentieel eigen gebied ${mln(kk.best)} per jaar (incl. btw), ${num(kk.hh)} huishoudens, ${kk.pc4} postcodes.`,
`Inkomensindex ${dec(kk.inkidx,1)}: hoger dan Hilversum (${dec(R.Hilversum.inkidx,1)}) en De Bilt (${dec(R['De Bilt'].inkidx,1)}).`,
`Marktaandeel Van der Wal nu ${dec(kk.ma,2)}%, het laagste van alle gebieden.`,
`Overlap alleen met De Bilt (${D.Austerlitz.rt_nieuw_naar_oud} min): ${p.bestaand.pc4} postcodes dichter bij De Bilt, ${p.gelijk.pc4} even ver.`,
`Omzet 2025 uit het eigen gebied ${eur(c.nieuw.omzet)}, waarvan ${eur(c.nieuw.via['De Bilt'])} via De Bilt.`];
const inter=isB?[
`Baarn opent een groot gebied, maar een deel daarvan wordt al vanuit Hilversum en Bussum bediend; die omzet verschuift hooguit intern.`,
`Het grootste nog onbediende deel ligt in Amersfoort-Noord, Hoogland en Bunschoten, op de rand van de 15 minuten.`,
`Of klanten uit Amersfoort Baarn kiezen boven de showroom in Hilversum, blijkt niet uit deze gegevens.`]:[
`Een koopkrachtig maar klein gebied: minder dan de helft van het marktpotentieel van Baarn.`,
`Het lage huidige marktaandeel laat ruimte zien, maar is geen bewijs dat een winkel die ruimte invult.`,
`De overlap met De Bilt is beperkt tot Zeist-West en omgeving.`];
return head('Beslisslide '+(isB?'B':'A'),isB?'Baarn: marktpotentieel en mogelijke omzetverschuiving':'Austerlitz: marktpotentieel en belangrijkste aandachtspunten','')+
`<div class="g4"><div class="card" style="border-top:4px solid ${col}"><div class="lbl">Marktpotentieel</div><div class="mid" style="color:${col}">${mln(kk.best)}</div><div class="foot">eigen gebied, per jaar, incl. btw</div></div>
<div class="card"><div class="lbl">Huishoudens</div><div class="mid">${num(kk.hh)}</div></div>
<div class="card"><div class="lbl">Inkomensindex</div><div class="mid">${dec(kk.inkidx,1)}</div></div>
<div class="card"><div class="lbl">Marktaandeel nu</div><div class="mid">${dec(kk.ma,2)}%</div><div class="foot">referentie ${dec(R.Bussum.ma,1)}–${dec(R.Hilversum.ma,1)}%</div></div></div>
<div class="g2" style="margin-top:16px;align-items:start"><div class="card"><div class="lbl">${tag.feit} Vastgesteld</div><ul class="list">${feiten.map(f=>`<li style="grid-template-columns:18px 1fr"><span style="color:${col}">●</span><span>${f}</span></li>`).join('')}</ul></div>
<div class="card"><div class="lbl">${tag.int} Interpretatie</div><ul class="list">${inter.map(f=>`<li style="grid-template-columns:18px 1fr"><span style="color:#cbbcf2">●</span><span>${f}</span></li>`).join('')}</ul></div></div>
<div class="question">${isB?'Welk aanvullend marktbereik biedt Baarn en hoe verhoudt dat zich tot de mogelijke verschuiving van bestaande klanten?':'Welke inzichten biedt het onderzochte marktpotentieel voor de mogelijke ombouw van Verandi naar Ambiance?'}</div>
<div class="note">Geen omzetverwachting. Referentiepercentages zijn gerealiseerde marktaandelen van de bestaande vestigingen in 2025.</div>`;}

/* 13 VERDIEPING eigen gebied per postcode (toggle) */
function rLoc(){const n=state.loc,p=P[n],col=C[n],rows=p.postcodes.filter(r=>r.klasse==='nieuw').sort((a,b)=>b.best-a.best),max=rows[0].best,leeg=rows.filter(r=>r.omzet===0);
return head('Verdieping',`${n}: marktpotentieel per postcode in het eigen gebied`,`Balk = marktpotentieel per jaar, wit streepje = omzet Van der Wal 2025. Beide incl. btw. ${leeg.length} postcodes (samen ${mln(sum(leeg,r=>r.best))}) hadden in 2025 geen klant.`)+
`<div class="card"><div class="hb hbh"><div>Postcode</div><div>Marktpotentieel &nbsp;<span style="color:#fff">▬</span> omzet 2025</div><div class="r">Potentieel</div><div class="r r2">Omzet</div></div>
${rows.map(r=>`<div class="hb"><div class="nm"><b>${r.naam}</b><span>${r.pc4}</span></div><div class="tr"><i class="grow" style="background:${col};opacity:.85" data-w="${W(r.best,max)}"></i><u class="grow" data-w="${W(r.omzet,max)}"></u></div><div class="r">${k(r.best)}</div><div class="r r2">${r.omzet?k(r.omzet):'<span class="zero">geen</span>'}</div></div>`).join('')}</div>`;}

/* 14 VERDIEPING alle postcodes (toggle) */
function rTabel(){const n=state.loc,o=D[n].oud,p=P[n],om={};D[n].postcodes.forEach(r=>om[r.pc4]=r);
const order={nieuw:0,gelijk:1,onzeker:2,bestaand:3},rows=[...p.postcodes].sort((a,b)=>order[a.klasse]-order[b.klasse]||b.best-a.best);
const rt=(r,v)=>r.rt[v]!=null?r.rt[v]:(r.rt_label[v]==='>30'?'>30':r.rt_label[v]==='>15'?'>15':'≤15?');
return head('Verdieping',`${n}: alle ${rows.length} postcodes binnen 15 minuten`,'Reistijd in minuten. Marktpotentieel en omzet 2025 incl. btw. Rayon volgens de aangeleverde lijst van '+o+'.')+
`<div class="card scroll"><table class="tbl"><thead><tr><th>Postcode</th><th>Indeling</th><th class="num">${n}</th><th class="num">Hilv.</th><th class="num">Bussum</th><th class="num">De Bilt</th><th>Rayon</th><th class="num">Index</th><th class="num">Huish.</th><th class="num">Marktpotentieel</th><th class="num">Omzet 2025</th><th class="num">via ${o}</th></tr></thead><tbody>
${rows.map(r=>`<tr><td><b>${r.naam}</b> <span style="color:var(--sub2);font-size:11px">${r.pc4}</span></td><td><span class="pill ${KL[r.klasse][1]}">${KL[r.klasse][0]}</span></td><td class="num">${r.rt_nieuw}</td>${VEST.map(v=>`<td class="num">${rt(r,v)}</td>`).join('')}<td>${om[r.pc4].in_rayon?'Ja':'<span style="color:var(--sub2)">Nee</span>'}</td><td class="num">${r.inkidx}</td><td class="num">${num(r.hh)}</td><td class="num">${eur(r.best)}</td><td class="num">${om[r.pc4].omzet?eur(om[r.pc4].omzet):'–'}</td><td class="num">${om[r.pc4].via[o]?eur(om[r.pc4].via[o]):'–'}</td></tr>`).join('')}
<tr class="tot"><td colspan="7">Totaal</td><td class="num">${dec(p.totaal15.inkidx,1)}</td><td class="num">${num(p.totaal15.hh)}</td><td class="num">${eur(p.totaal15.best)}</td><td class="num">${eur(D[n].omzet)}</td><td class="num">${eur(D[n].per_vest[o])}</td></tr></tbody></table></div>`;}

/* 15 DEFINITIES */
function rDef(){const it=[['Marktpotentieel','Consumptieve besteding aan horren, binnen- en buitenzonwering per jaar, incl. btw, van de huishoudens in een gebied. Geen omzet.'],
['Eigen verzorgingsgebied','De postcodes binnen 15 minuten van de nieuwe winkel die dichter bij die winkel liggen dan bij Hilversum, Bussum en De Bilt. Gelijke of onbekende reistijd telt niet mee.'],
['Omzet','Gerealiseerde particuliere omzet 2025 van Van der Wal, incl. btw, op postcode van het privéadres.'],
['Marktaandeel bestaande vestiging','Eigen omzet 2025 van die vestiging uit postcodes binnen 15 minuten, gedeeld door het marktpotentieel daar.'],
['Marktaandeel nieuw gebied','Omzet 2025 van alle Van der Wal-vestigingen samen uit het eigen verzorgingsgebied, gedeeld door het marktpotentieel daar.'],
['Inkomensindex','Gemiddelde van de postcodes, gewogen naar aantal inwoners. 100 = landelijk gemiddelde.'],
['Omzetverschuiving','Bestaande omzet uit postcodes die dichter bij de nieuwe winkel liggen. Blijft binnen Van der Wal; geen extra omzet en geen voorspelling van gedrag.']];
return head('Verdieping','Begrippen','Deze definities gelden op elke slide.')+`<div class="card"><table><tbody>${it.map(r=>`<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`;}

/* 16 METHODE */
function rMethode(){const it=[['Omzet','Verkoopkansen_5.xlsx, omzetdatum 2025, alleen particulier (privéadres ingevuld), incl. btw. Alle vestigingen van Van der Wal tellen mee.'],
['15-minutengebied','"Postcodes 15 min vanaf Nijhof Baarn" en "Postcodes 15 min vanaf Verandi Austerlitz", zoals aangeleverd.'],
['Reistijden bestaande vestigingen','Hilversum: "Postcodes 45 minuten vanaf Van der Wal Hilversum" (loopt tot 30 min). De Bilt: "Postcodes 30 minuten vanaf De Bilt". Bussum: MCR-reistijdtabblad in Bussum_2025_compleet en de MCR-lijst 15 minuten vanaf 1401.'],
['Marktpotentieel','MCR Retailminds (bron CBS/BAG/Panteia), compleet-bestanden. Controle: het Austerlitz-gebied sluit exact aan op de MCR-quickscan (€12.206.499, 122.700 inwoners, index 117).'],
['Controle indeling','Per postcode opnieuw vergeleken: reistijd nieuwe winkel tegen de kortste reistijd naar Hilversum, Bussum en De Bilt. Alle 53 postcodes komen overeen met de indeling, en de totalen en gewogen indexen sluiten aan.'],
['Aandeel binnen 15 min','Bestaande analyse: Hilversum haalt '+dec(D.regel80.Hilversum.p15,1)+'% van de omzet binnen 15 minuten, De Bilt '+dec(D.regel80['De Bilt'].p15,1)+'%. Hier alleen gebruikt om te laten zien dat Hilversum ook van verder klanten trekt.'],
['Rayon','Postcodelijsten Hilversum en De Bilt zoals aangeleverd. 3621 en 3723 staan in beide lijsten.'],
['Projectorder',`${num(D.project.orders)} orders in één straat in ${D.project.pc4} (${D.project.maand}, ${eur(D.project.omzet)}, via ${D.project.vest}) niet meegeteld.`],
['Niet in dit rapport','Omzetverwachtingen, investeringskosten, omzet en bezoekers van de Nijhof- en Verandi-winkels, zakelijke omzet (wel genoemd), andere reistijdgrenzen dan 15 minuten.']];
return head('Verdieping','Methode en bronnen','')+`<div class="card"><table><tbody>${it.map(r=>`<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>`;}

go(0);
(function(){const PW="@mbianceVDW",g=document.getElementById('gate'),i=document.getElementById('pw'),e=document.getElementById('pwErr');
function t(){if(i.value===PW){g.style.display='none';go(state.slide);}else{e.textContent='Onjuist wachtwoord';i.classList.remove('err');void i.offsetWidth;i.classList.add('err');i.value='';i.focus();}}
document.getElementById('pwBtn').onclick=t;i.addEventListener('keydown',x=>{if(x.key==='Enter')t();});i.focus();})();
</script></body></html>
